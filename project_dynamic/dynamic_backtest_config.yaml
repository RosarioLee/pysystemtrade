# YAML
# Robert Carver's Dynamic Optimization Configuration
# Adapted for backtesting with sample data - CORRECTED VERSION
# Based on systems/provided/rob_system/config.yaml

# ============================================================
# COST AND EXECUTION SETTINGS
# ============================================================
use_SR_costs: True
# vol_normalise_currency_costs: True
# multiply_roll_costs_by: 0.5
# percentage_cost: 0.01  # 1 basis point per trade
# value_of_block_commission: 0.0
# value_of_pertrade_commission: 0.0

# ============================================================
# SYSTEM IDENTIFICATION
# ============================================================
use_forecast_weight_estimates: False
use_forecast_div_mult_estimates: True
use_instrument_weight_estimates: True
use_instrument_div_mult_estimates: False
use_forecast_scale_estimates: False

forecast_scalar_estimate:
   pool_instruments: True
   func: "sysquant.estimators.forecast_scalar.forecast_scalar"
   window: 250000
   min_periods: 500
   backfill: True

# Start date for backtesting
start_date: 2000-01-19
#start_date: "2004-01-01"
# end_date: "2006-12-31"
# ============================================================
# FORECAST DIVERSIFICATION MULTIPLIER ESTIMATION - CORRECTED
# ============================================================
forecast_div_mult_estimate:
  func: sysquant.estimators.diversification_multipliers.diversification_multiplier_from_list
  ewma_span: 125                         # 125-day correlation span
  dm_max: 2.5                           # Maximum multiplier (safety cap)

# ============================================================
# FORECAST CORRELATION ESTIMATION - WORKING CONFIGURATION
# ============================================================
forecast_correlation_estimate:
  pool_instruments: True
  func: sysquant.estimators.pooled_correlation.pooled_correlation_estimator
  frequency: "W"
  date_method: "expanding"
  using_exponent: True
  ew_lookback: 250
  min_periods: 20
  cleaning: True
  rollyears: 20
  floor_at_zero: True
  forward_fill_data: True

forecast_cost_estimates:
  use_pooled_costs: False           # Instrument-specific costs (important!)
  use_pooled_turnover: True         # Pool turnover across instruments

# Add this section with CORRECT settings
forecast_weight_estimate:
  func: sysquant.optimisation.generic_optimiser.genericOptimiser

  # Core optimization method
  method: handcraft                 # or 'shrinkage' or 'one_period'

  # Cost handling (Robert's recommended approach)
  cost_multiplier: 0.0              # Optimize on gross returns
  apply_cost_weight: True           # Apply cost adjustment AFTER
  ceiling_cost_SR: 9999             # Eliminate rules > 0.13 SR cost

  # Pooling strategy
  pool_gross_returns: True          # Pool returns across instruments
  equalise_gross: False             # Don't equalize

  # Time parameters
  frequency: "W"                    # Weekly resampling
  date_method: "expanding"          # Use all history
  rollyears: 20                     # 20 years maximum

  # Statistical parameters
  cleaning: True
  equalise_SR: False
  equalise_vols: True
  ann_target_SR: 0.5
  shrinkage_SR: 0.9
  shrinkage_corr: 0.5

  # Sub-estimators (copy from defaults.yaml)
  correlation_estimate:
    func: sysquant.estimators.correlation_estimator.correlationEstimator
    using_exponent: True
    ew_lookback: 50000
    min_periods: 10
    cleaning: False
    floor_at_zero: False

  mean_estimate:
    func: sysquant.estimators.mean_estimator.meanEstimator
    using_exponent: True
    ew_lookback: 50000
    min_periods: 5

  vol_estimate:
    func: sysquant.estimators.stdev_estimator.stdevEstimator
    using_exponent: True
    ew_lookback: 50000
    min_periods: 5


# ============================================================
# VOLATILITY CALCULATION
# ============================================================
volatility_calculation:
  func: sysquant.estimators.vol.mixed_vol_calc
  days: 35
  min_periods: 10
  vol_abs_min: 0.0000000001
  slow_vol_years: 10
  proportion_of_slow_vol: 0.3
  backfill: True

# ============================================================
# CORE TRADING RULES (Subset for Testing)
# ============================================================
#
use_attenuation:
   - 'breakout10'
   - 'breakout20'
   - 'breakout40'
   - 'breakout80'
   - 'breakout160'
   - 'breakout320'
   - 'relmomentum10'
   - 'relmomentum20'
   - 'relmomentum40'
   - 'relmomentum80'
   - 'mrinasset1000'
   - 'assettrend2'
   - 'assettrend4'
   - 'assettrend8'
   - 'assettrend16'
   - 'assettrend32'
   - 'assettrend64'
   - 'normmom2'
   - 'normmom4'
   - 'normmom8'
   - 'normmom16'
   - 'normmom32'
   - 'normmom64'
   - 'momentum4'
   - 'momentum8'
   - 'momentum16'
   - 'momentum32'
   - 'momentum64'
