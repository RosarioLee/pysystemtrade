# ============================================================
# RISK MANAGEMENT
# ============================================================
risk_overlay:
  max_risk_fraction_normal_risk: 1.0     # Normal risk fraction limit
  max_risk_fraction_stdev_risk: 2.0      # Stress risk fraction limit
  max_risk_limit_sum_abs_risk: 3.0       # Absolute risk sum limit
  max_risk_leverage: 8.0                 # Maximum system leverage

  # NEW: Dynamic risk scaling parameters
  risk_scaling_method: "dynamic"          # Use dynamic vs static scaling
  risk_lookback_days: 125                # Risk estimation lookback
  risk_target_correlation: 0.2           # Target correlation for risk scaling

# Optimization constraints for small system
optimization_constraints:
  max_position_size_risk_fraction: 0.15  # No single position > 15% risk
  min_position_size_threshold: 0.01      # Minimum meaningful position size
  integer_position_rounding: True        # Enforce integer contract positions

  # Speed limits (prevent overtrading)
  max_portfolio_turnover_per_day: 0.5    # Max 50% portfolio turnover/day
  position_change_speed_limit: 10.0      # Max 10 contract changes per instrument

# ============================================================
# COST AND EXECUTION SETTINGS
# ============================================================
use_SR_costs: False
vol_normalise_currency_costs: True
multiply_roll_costs_by: 0.5

# Simple uniform cost to prevent "Trade costs are zero" error
percentage_cost_per_trade: 0.01  # 1 basis point per trade

# ============================================================
# CORRELATION AND ESTIMATION SETTINGS
# ============================================================
instrument_returns_correlation:
  func: sysquant.estimators.correlation_over_time.correlation_over_time_for_returns
  interval_frequency: "W"
  frequency: "7D"
  date_method: "rolling"
  using_exponent: True
  ew_lookback: 75
  min_periods: 10
  cleaning: True
  offdiag: 0.0
  rollyears: 5
  floor_at_zero: False
  forward_fill_price_index: True
  clip: 0.99


# Instrument diversification multiplier estimation
instrument_div_mult_estimate:
  func: sysquant.estimators.diversification_multipliers.diversification_multiplier_from_list
  ewma_span: 125
  dm_max: 2.5

# ============================================================
# PART 3: PORTFOLIO OPTIMIZATION ENGINE CONFIGURATION
# ============================================================

# Advanced portfolio optimization (Robert's latest approach)
instrument_weight_estimate:
  func: sysquant.optimisation.generic_optimiser.genericOptimiser
  frequency: "W"                        # Weekly reoptimization
  date_method: "rolling"                # Rolling window optimization
  rollyears: 3                          # 3-year optimization window
  method: "handcraft"                   # Robert's preferred method

  # Optimization parameters
  cleaning: True                        # Clean outliers from data
  equalise_gross: False                 # Don't force equal gross exposure
  equalise_SR: True                     # Equalize Sharpe ratios
  equalise_vols: True                   # Equalize volatilities

  # Risk targeting
  ann_target_SR: 0.5                    # Target 0.5 annual Sharpe ratio
  ceiling_cost_SR: 0.13                # Speed limit: max cost 0.13 SR units

  # Shrinkage parameters (crucial for stability)
  shrinkage_SR: 0.9                     # Heavy shrinkage toward average SR
  shrinkage_corr: 0.5                   # Correlation shrinkage

  # Cost integration
  apply_cost_weight: True               # Include costs in optimization
  cost_multiplier: 1.0                  # Cost penalty multiplier
