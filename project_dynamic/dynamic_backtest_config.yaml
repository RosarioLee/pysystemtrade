# YAML
# Robert Carver's Dynamic Optimization Configuration
# Adapted for backtesting with sample data - CORRECTED VERSION
# Based on systems/provided/rob_system/config.yaml

# ============================================================
# SYSTEM IDENTIFICATION
# ============================================================
use_forecast_weight_estimates: False
use_forecast_div_mult_estimates: True
use_instrument_weight_estimates: False
use_instrument_div_mult_estimates: True
use_forecast_scale_estimates: False

# Start date for backtesting
start_date: 2000-01-19

# ============================================================
# FORECAST DIVERSIFICATION MULTIPLIER ESTIMATION - CORRECTED
# ============================================================
forecast_div_mult_estimate:
  func: sysquant.estimators.diversification_multipliers.diversification_multiplier_from_list
  ewma_span: 125                         # 125-day correlation span
  dm_max: 2.5                           # Maximum multiplier (safety cap)

# ============================================================
# FORECAST CORRELATION ESTIMATION - WORKING CONFIGURATION
# ============================================================
forecast_correlation_estimate:
  pool_instruments: True
  func: sysquant.estimators.pooled_correlation.pooled_correlation_estimator
  frequency: "W"
  date_method: "expanding"
  using_exponent: True
  ew_lookback: 250
  min_periods: 20
  cleaning: True
  rollyears: 20
  floor_at_zero: True
  forward_fill_data: True




# ============================================================
# VOLATILITY CALCULATION
# ============================================================
volatility_calculation:
  func: sysquant.estimators.vol.mixed_vol_calc
  days: 35
  min_periods: 10
  vol_abs_min: 0.0000000001
  slow_vol_years: 10
  proportion_of_slow_vol: 0.3
  backfill: True

# ============================================================
# CORE TRADING RULES (Subset for Testing)
# ============================================================
trading_rules:
  # Breakout rules
  breakout10:
    function: systems.provided.rules.breakout.breakout
    data:
      - rawdata.get_daily_prices
    other_args:
      lookback: 10
  breakout40:
    function: systems.provided.rules.breakout.breakout
    data:
      - rawdata.get_daily_prices
    other_args:
      lookback: 40
  breakout160:
    function: systems.provided.rules.breakout.breakout
    data:
      - rawdata.get_daily_prices
    other_args:
      lookback: 160

  # Momentum rules
  momentum16:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - rawdata.get_daily_prices
      - rawdata.daily_returns_volatility
    other_args:
      Lfast: 16
      Lslow: 64

  momentum64:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - rawdata.get_daily_prices
      - rawdata.daily_returns_volatility
    other_args:
      Lfast: 64
      Lslow: 256

  # Carry rule
  carry60:
    function: systems.provided.rules.carry.carry
    data:
      - rawdata.raw_carry
    other_args:
      smooth_days: 60

# ============================================================
# FORECAST CONFIGURATION
# ============================================================
forecast_cap: 20.0

# Forecast scalars (from Rob's config)
forecast_scalars:
  breakout10: 0.603
  breakout40: 0.704
  breakout160: 0.739
  momentum16: 4.104
  momentum64: 1.909
  carry60: 28.401

# FIXED: Complete forecast weights for ALL instruments (not just 3)
# ============================================================
# FORECAST WEIGHTS - COMPLETE FOR ALL 114 INSTRUMENTS
# Following Robert Carver's Asset-Class Specific Approach
# ============================================================
forecast_weights:
  # Apply these weights to ALL instruments
  breakout10: 0.10
  breakout40: 0.15
  breakout160: 0.20
  momentum16: 0.20
  momentum64: 0.25
  carry60: 0.10

forecast_div_multiplier: 1.75

# ============================================================
# CAPITAL AND RISK CONFIGURATION
# ============================================================
percentage_vol_target: 20.0  # Reduced from Rob's 25% for testing
notional_trading_capital: 150000  # Reduced from Rob's 500k for testing
base_currency: USD

# ============================================================
# DYNAMIC OPTIMIZATION PARAMETERS - CORRECTED VALUES
# ============================================================
small_system:
  shadow_cost: 50                    # Correct value from latest pysystemtrade
  cost_multiplier: 1.0              # Standard cost multiplier
  tracking_error_buffer: 0.0125     # Tracking error buffer (NOT shadow cost)
  shrink_instrument_returns_correlation: 0.5  # Correlation shrinkage factor
  max_risk_fraction_normal_risk: 0.999999     # Risk control parameters
  max_risk_fraction_stdev_risk: 5.0

# ============================================================
# POSITION BUFFERING - CORRECTED FROM DEFAULTS
# ============================================================
buffer_method: forecast
buffer_size: 0.10
buffer_trade_to_edge: True



